; Wolf ISM8 - deutsche Texte
;
; Gelesen von wi_t() in webfrontend/htmlauth/wi_lib.php.
; Die Schluessel muessen mit language_en.ini deckungsgleich sein; Englisch ist
; die Rueckfallebene. Werte in doppelten Anfuehrungszeichen, %s sind
; Platzhalter (sprintf) und muessen in Zahl und Reihenfolge erhalten bleiben.
;
; Bis 2.5.0 war templates/lang ein LEERER Ordner - das Geruest stand da,
; gefuellt hat es niemand. Seit 2.5.1 steht die gesamte Oberflaeche hier.
;
; ZWEI SCHREIBWEISEN, mit Absicht:
;   [KOPF] bis [LOG]  = HTML. Umlaute als Entitaet (ä), Auszeichnung wie
;                       <b> ist erlaubt - diese Texte gehen ungefiltert in die
;                       Seite.
;   [PRUEF]           = Klartext der Testausgaben. Die werden von wi_e()
;                       maskiert, eine Entitaet stuende dort woertlich da.
;                       Deshalb umschrieben (ae, oe, ue) und ohne Auszeichnung.
;
; Mehrzeilige Ausgaben stehen als ein Schluessel JE ZEILE (..._1, ..._2, ...)
; und werden im PHP mit "\n" zusammengesetzt. INI-Werte ueber mehrere Zeilen
; waeren mit INI_SCANNER_RAW eine Wette auf das Verhalten des Parsers.
; Doppelte Anfuehrungszeichen kommen in den Werten nicht vor - sie wuerden den
; Wert vorzeitig beenden; im Text stehen daher einfache.

