; Wolf ISM8 - English texts
;
; Read by wi_t() in webfrontend/htmlauth/wi_lib.php.
; The keys must match language_de.ini exactly; English is the fallback for any
; language without its own file. Values in double quotes, %s are placeholders
; (sprintf) and must keep their number and order.
;
; TWO WRITING STYLES, on purpose:
;   [KOPF] .. [LOG]  = HTML. Entities and markup like <b> are allowed - these
;                      texts go into the page unfiltered.
;   [PRUEF]          = plain text of the test output. It is escaped by wi_e(),
;                      so an entity would show up literally. No markup there.
;
; Multi-line output is stored as one key PER LINE (.._1, .._2, ...) and joined
; with "\n" in PHP. Values never contain a double quote - it would end the
; value early; single quotes are used inside the text instead.

