Z3_04 = "Radio Buttons | Warmwasser-Programm (WOLF) | Button 1 “Automatik”, button 2 “Dauerbetrieb”, button 3 “Standby (aus)”; text for “no button selected”: “wie an der Heizung”; remanence off | —"
Z3_05 = "Formula | Warmwasser-Programm als Zahl (WOLF) | (I1-1)*2 (button 1–3 gives 0, 2, 4 – the only values the heating accepts; without a selected button -2, the command bridge rejects it) | I1 = #4"
Z3_06 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | WOLF ISM NG: Warmwasser-Programm stellen | Command for analog value: publish wolf_ng/befehl/direkter/heizkreis/programmwahl/warmwasser <v.0> (never retain); 0 automatic, 2 continuous operation, 4 standby; both tick boxes | Input = #5"
Z3_07 = "Virtual Input (Slider) | Warmwasser-Solltemperatur (WOLF) | Min 40, Max 60, step 1, start value 48 (°C); in the app; the plugin allows 20 to 80 °C and rejects anything outside | —"
Z3_08 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | WOLF ISM NG: Warmwasser-Solltemperatur stellen | Command for analog value: publish wolf_ng/befehl/direkter/heizkreis/warmwassersolltemperatur <v.1> (never retain); hot water set temperature in °C; both tick boxes | Input = #7"
Z3_09 = "Virtual Input (Slider) | Sollwertkorrektur (WOLF) | Min -4, Max 4, step 0.5, start value 0 (K); in the app; shifts the room set temperature of the heating circuit up or down | —"
Z3_10 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | WOLF ISM NG: Sollwertkorrektur stellen | Command for analog value: publish wolf_ng/befehl/direkter/heizkreis/sollwertkorrektur <v.1> (never retain); set value correction in K (-4 to 4); both tick boxes | Input = #9"
Z3_11 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Direkter_Heizkreis_Programmwahl_Heizkreis | Programme selection the heating currently has: 0 automatic, 1 heating mode, 2 standby, 3 economy mode, 4 permanent cooling | —"
Z3_12 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Direkter_Heizkreis_Sollwertkorrektur | Set value correction the heating currently has, in K | —"
Z3_13 = "Status | Heizkreis-Programm Rückmeldung (WOLF) | Rows: V1 = 0 “automatic (by time programme) – correction <v2.1> K”; V1 = 1 “heating mode (permanent) – correction <v2.1> K”; V1 = 2 “standby – frost protection only”; V1 = 3 “economy mode (lowered) – correction <v2.1> K”; V1 = 4 “permanent cooling”; without condition “programme <v1> – unknown”; Visualisation ON | V1 = #11, V2 = #12"
Z3_14 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_sg_laden | Display name “SG-Ladefenster (WOLF)”; 1 = according to the plan of the SG module a charging window is running right now; only with the SG module switched on (tab SG-Ready, off by default) | —"
Z3_15 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_sg_dimmen | Display name “§ 14a gedimmt (WOLF)”; 1 = the grid operator dims, 0 = not, -1 = signal missing, outdated or unreadable (then nothing is dimmed) | —"
Z3_16 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_sg_fenster | Display name “SG-Ladefenster geplant (WOLF)”; number of planned charging windows | —"
Z3_17 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_sg_naechster_preis | Display name “SG nächstes Fenster Preis (WOLF)”; average exchange price of the next charging window in ct/kWh, -1 = no plan | —"
Z3_18 = "Virtual Text Input | wolf_ng_sg_lage | create by hand, name exactly like this (the name the MQTT gateway assigns), “Use in User Interface” on; what applies at the heating: “normal”, “laden” or “dimmen” (after switching off once “aus”) | —"
Z3_19 = "Status | SG-Ready (WOLF) | Rows: V2 = 1 “§ 14a: the grid operator dims – the plugin takes back heating circuit (economy or standby) and hot water (standby)”; V2 < 0 “§ 14a signal missing or outdated – nothing is dimmed; read ‘The situation now’ in the plugin tab SG-Ready”; V1 = 1 “charging window according to plan – raised only with ‘Write to the heating’; applies at the heating now: <v5>”; V3 > 0 “normal – <v3> charging windows planned, the next one on average <v4.2> ct/kWh (exchange price)”; without condition “normal – no charging window planned (SG module off or no prices)”; Visualisation ON | V1 = #14, V2 = #15, V3 = #16, V4 = #17, V5 = #18"
SEITE1_SCHRITT1 = "In the web interface of the ISM8 enter the IP address of the LoxBerry and the port shown in step 1 above as the target. In the plugin tab “Settings” switch on the server, choose the firmware of the ISM8 and – if available – the fault code table of your own heat generator; save. Tab “Test” → “Last received values”: rows arrive (the ISM8 only sends changes – wait a few minutes)."
SEITE1_SCHRITT2 = "MQTT gateway: under version 1 do nothing – the plugin enters the subscription by itself. Under version 2 (LoxBerry → System → MQTT Gateway → Subscriptions) tick the data points of the tick list (at the top of this tab, step 3). Without subscription or ticks nothing arrives at the Miniserver."
SEITE1_SCHRITT3 = "In Loxone Config under Periphery → Virtual Inputs create the inputs of this page as simple Virtual Inputs (no. 1, 2, 10, 11, 12, 17), titles exactly as in the column Name – the name table above has a copy button. Do not tick “Use as digital input”, not even for fault or burner (the gateway turns true/false into 1/0). The LoxBerry user on the Miniserver needs rights on the inputs. Whoever copies the page from the sample project gets the inputs with it."
SEITE1_SCHRITT4 = "Create the page “WOLF ISM NG” and drag the 6 inputs onto it, plus “Konstante 1” if already in the project (otherwise create it as a constant). Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (WOLF)” and “Meldung Heizung gestört (WOLF)”, text as in the list. Each gets exactly one connection (from no. 7 or no. 14)."
SEITE1_SCHRITT5 = "Insert the remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value validator no. 4: remove the tick at ‘En’ in the properties window (Config creates En inverted). Enter the status rows in the given order, the one without condition last."
SEITE1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (WOLF)” shows “läuft – ISM8 verbunden, Lebenszeichen …”, the number grows every minute; “Betriebsart Heizgerät (WOLF)” usually shows “Heiz- und Warmwasserbetrieb”."
SEITE1_H1 = "<b>On no. 1 and 4:</b> the ISM8 only sends on change – only the heartbeat counter status/zaehler (no. 1) gives away a stopped LoxBerry, MQTT gateway or service. If no new value arrives within Tmc (300 s), the value validator reports at its output E. Unconnected, En is ON, but Config creates En inverted: remove the tick at ‘En’ in the properties window. status/ok (no. 2) arrives with every heartbeat and is never retained – a dead service leaves no “1” behind."
SEITE1_H2 = "<b>On no. 7 and 14:</b> the switch-on delays swallow short disconnections when the ISM8, the service or the LoxBerry restarts, or a fault message that flashes up briefly. “Plugin gestört” comes after 10 minutes without ISM8 connection and after about 15 minutes if the LoxBerry or the service has stopped; “Heizung gestört” one minute after the fault message of the appliance."
SEITE1_H3 = "Whoever sets the sign of life of the plugin to a different interval (tab Settings, “Sign of life every … seconds”) sets Tmc on no. 4 to five times that; 0 switches the sign of life off – then no. 4 reports permanently."
SEITE1_H4 = "Further devices with a fault message (mixer circuit, solar module, ventilation …): one more OR before no. 14 for each fault – an OR has two inputs, and a notification never gets several sources directly."
SEITE1_H5 = "The plain text of the fault code (no. 12) and of the operating mode (no. 17) is shown further down in this tab under “Fault codes in plain text” and “Operating modes in plain text”. Heat pumps (BWL-1-S, CHA) use other numbers for the operating mode – adapt the rows of no. 18 to that table."
SEITE1_H6 = "Names with umlauts (Heizgerät, Störung, Außentemperatur, Rücklauftemperatur): whether the MQTT gateway matches them to the title has not been checked on any installation. If an input never receives a value, compare the line “Preparing input …” in the gateway log with the title of the input."
SEITE1_H7 = "Old path UDP/TCP instead of MQTT: templates “UDP inputs” and “TCP outputs” (above under “Existing installations”), titles “&lt;Gerät&gt; &lt;Name&gt;”, sign of life “Zähler (Lebenszeichen)”, connection “Online” – the same blocks, only other inputs. Use only one of the two paths for the same blocks."
SEITE2_SCHRITT1 = "Create the inputs of this page as on the page “WOLF ISM NG” as simple Virtual Inputs, titles from the column Name (no. 1–3, 5–9, 11, 13–16, 18)."
SEITE2_SCHRITT2 = "Create the page “WOLF ISM NG Werte” and drag the 14 inputs onto it. Switch on “Statistics” in the properties window of boiler temperature, outdoor temperature, modulation level and hot water temperature."
SEITE2_SCHRITT3 = "Create the notification “Meldung Anlagendruck niedrig (WOLF)” (Periphery → Messages → Notification), text as in the list."
SEITE2_SCHRITT4 = "Remaining blocks via F5; enter the formulas and the on/off values of the threshold switches as in the list. On the status “Heizkreis jetzt (WOLF)” first click the “+” three times (V5 to V7)."
SEITE2_SCHRITT5 = "Save and transfer. Check: compare boiler and hot water temperature with the display on the operating module, “Anlagendruck (WOLF)” with the pressure gauge."
SEITE2_H1 = "Measured values (temperatures, pressure, output) only arrive on change and at the latest every 30 minutes; after a restart of the Miniserver a value may show 0 until then. States (burner, pumps, programmes) are there at once."
SEITE2_H2 = "<b>On no. 18 to 25:</b> the system pressure arrives in Pa (100 000 Pa = 1 bar), no. 19 converts it to bar. On input no. 18 set “Min” −670000 and “Max” 670000 under validation in the properties window (the name table shows the range) – Loxone turns every value outside the limits into 0, and “Anlagendruck (WOLF)” then permanently shows “kein Druckwert”."
SEITE2_H3 = "“Druck niedrig” (no. 21) is an example – the heating engineer names the minimum pressure of your own system. “Druck gemeldet” (no. 20) keeps the message quiet as long as there is no pressure value."
SEITE2_H4 = "The room temperature (no. 6) only arrives with a room sensor in the operating module; otherwise it shows 0."
SEITE2_H5 = "Several heating circuits: create the blocks of the mixer circuit following the same pattern (tick the device “Mischerkreis 1 + Warmwasser 1” at the top)."
SEITE3_SCHRITT1 = "On the MQTT tab tick “Accept commands via MQTT” and “Set the heating via MQTT” and save (both off by default). The four commands (no. 3, 6, 8, 10) go to the shared output “LoxBerry MQTT-Gateway” (address /dev/udp/&lt;LoxBerry&gt;/11884) – without it, download the “Template MQTT commands” above and import it once (Periphery → Virtual Outputs → Import Template)."
SEITE3_SCHRITT2 = "Create the page “WOLF ISM NG Bedienung”. Create the 4 commands with exactly the command of the list (command for analog value, never retain) and the 2 feedback values (no. 11, 12) as Virtual Inputs from the name table."
SEITE3_SCHRITT3 = "Create two radio buttons: number of buttons and button texts as in the list, text for “no button selected” “wie an der Heizung”, remanence off. The output with the number of the selected button is called “N” in Config: connect output N to input I1 of the formula (no. 2 or no. 5). Create two sliders (Periphery → Virtual Inputs) with Min, Max, step and start value as in the list, plus the two formulas."
SEITE3_SCHRITT4 = "Only if the SG module of the plugin is used (tab SG-Ready): create four Virtual Inputs and one Virtual Text Input with exactly the names of the list (no. 14–18; “Use in User Interface” on at the text input) and click the “+” once on the status “SG-Ready (WOLF)” (V5). Without the SG module leave out no. 14–19."
SEITE3_SCHRITT5 = "Save and transfer. Check: set “Warmwasser-Programm (WOLF)” to “Dauerbetrieb” in the app – after a short time “Warmwasser (WOLF)” on the page “WOLF ISM NG Werte” shows “Dauerbetrieb”. The command appears in the plugin tab “Test” → “Last received values”."
SEITE3_H1 = "<b>These commands write to the heating.</b> The plugin was built without a WOLF heating; what the heating does on a command has not been tried. After each first command check the operating module of the heating."
SEITE3_H2 = "Plugin and service protect: the command bridge only accepts with both tick boxes and only the permitted values (heating circuit 0–3, hot water 0–4, hot water 20–80 °C, correction −4 to +4 K); the service only takes 0, 2 or 4 for the hot water programme, sends nothing without a connection to the ISM8 and does not send the same value again within 60 s. The acknowledgement is under &lt;prefix&gt;/befehl/&lt;name&gt;/quittung (tab Test)."
SEITE3_H3 = "<b>On the radio buttons:</b> the formula turns output N (number of the selected button) into the value of the heating. Without a selected button a negative value results, which the plugin rejects – so after a restart of the Miniserver nothing is set (remanence off)."
SEITE3_H4 = "The SG module of the plugin sets the same four values when its situation changes. Whoever runs it with “Write to the heating” only adjusts by hand here – the next change of situation overwrites it. There is no § 14a signal from Loxone to the plugin."
SEITE3_H5 = "“Standby” means for the heating circuit: frost protection only; for hot water: no hot water. The time programmes are set on the heating."
SEITE3_H6 = "A write command needs a virtual output, not an input, and never the name of a gateway input (the commands are called “WOLF ISM NG: …”). The write test in the tab “Test” lets you rehearse a command as a dry run first."
SEITE3_H7 = "Up to 3.1.11 the commands of the output template “Wolf ISM8 MQTT Befehle” wrote to the state topics. Since 3.1.12 that only works with the tick box “Accept commands on the state topics (old path)”; an update sets it, a new installation does not. New: the commands of the list via the command bridge."
