SEITE1_SCHRITT1 = "In der Weboberfläche des ISM8 als Ziel die IP-Adresse des LoxBerry und den Port eintragen, die oben in Schritt 1 stehen. Im Plugin Reiter „Einstellungen“ den Server einschalten, die Firmware des ISM8 wählen und – wenn vorhanden – die Störcode-Tabelle des eigenen Wärmeerzeugers; speichern. Reiter „Test“ → „Zuletzt empfangene Werte“: es kommen Zeilen (das ISM8 schickt nur Änderungen – ein paar Minuten warten)."
SEITE1_SCHRITT2 = "MQTT-Gateway: unter Fassung 1 nichts tun – das Plugin trägt das Abo selbst ein. Unter Fassung 2 (LoxBerry → System → MQTT Gateway → Subscriptions) die Datenpunkte der Hakenliste anhaken (oben in diesem Reiter, Schritt 3). Ohne Abo bzw. Haken kommt am Miniserver nichts an."
SEITE1_SCHRITT3 = "In Loxone Config unter Peripherie → Virtuelle Eingänge die Eingänge dieser Seite als einfache Virtuelle Eingänge anlegen (Nr. 1, 2, 10, 11, 12, 17), Titel genau wie in der Spalte Name – die Namenstabelle oben hat einen Kopierknopf. „Als Digitaleingang verwenden“ nicht anhaken, auch nicht bei Störung oder Brenner (das Gateway macht aus true/false 1/0). Der LoxBerry-Benutzer am Miniserver braucht Rechte auf die Eingänge. Wer die Seite aus dem Musterprojekt kopiert, bekommt die Eingänge mit."
SEITE1_SCHRITT4 = "Seite „WOLF ISM NG“ anlegen und die 6 Eingänge darauf ziehen, dazu „Konstante 1“, falls schon im Projekt (sonst als Konstante neu). Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Plugin gestört (WOLF)“ und „Meldung Heizung gestört (WOLF)“, Text wie in der Liste. Jede bekommt genau eine Leitung (von Nr. 7 bzw. Nr. 14)."
SEITE1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5) einfügen, Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 4: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an). Die Status-Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
SEITE1_SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (WOLF)“ zeigt „läuft – ISM8 verbunden, Lebenszeichen …“, die Zahl wächst jede Minute; „Betriebsart Heizgerät (WOLF)“ zeigt meist „Heiz- und Warmwasserbetrieb“."
SEITE1_H1 = "<b>Zu Nr. 1 und 4:</b> das ISM8 sendet nur bei Änderung – nur der Herzschlag-Zähler status/zaehler (Nr. 1) verrät einen stehenden LoxBerry, ein stehendes MQTT-Gateway oder einen stehenden Dienst. Kommt innerhalb Tmc (300 s) kein neuer Wert, meldet die Analogwertvalidierung an ihrem Ausgang E. Unbeschaltet steht En auf EIN, Config legt En aber negiert an: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. status/ok (Nr. 2) kommt mit jedem Herzschlag und nie zurückbehalten – ein toter Dienst hinterlässt keine „1“."
SEITE1_H2 = "<b>Zu Nr. 7 und 14:</b> die Einschaltverzögerungen schlucken kurze Trennungen beim Neustart von ISM8, Dienst oder LoxBerry bzw. eine kurz aufblitzende Störmeldung. „Plugin gestört“ kommt nach 10 Minuten ohne ISM8-Verbindung und nach etwa 15 Minuten, wenn LoxBerry oder Dienst stehen; „Heizung gestört“ eine Minute nach der Störmeldung des Geräts."
SEITE1_H3 = "Wer im Plugin das Lebenszeichen auf einen anderen Takt stellt (Reiter Einstellungen, „Lebenszeichen alle … Sekunden“), setzt Tmc an Nr. 4 auf das Fünffache; 0 schaltet das Lebenszeichen ab – dann meldet Nr. 4 dauernd."
SEITE1_H4 = "Weitere Geräte mit Störmeldung (Mischerkreis, Solarmodul, Lüftung …): je Störung ein weiteres ODER vor Nr. 14 – ein ODER hat zwei Eingänge, und eine Benachrichtigung bekommt nie mehrere Quellen direkt."
SEITE1_H5 = "Den Klartext des Störcodes (Nr. 12) und der Betriebsart (Nr. 17) zeigt dieser Reiter weiter unten unter „Störcodes im Klartext“ und „Betriebsarten im Klartext“. Bei Wärmepumpen (BWL-1-S, CHA) gelten andere Zahlen für die Betriebsart – die Zeilen von Nr. 18 nach dieser Tabelle anpassen."
SEITE1_H6 = "Namen mit Umlaut (Heizgerät, Störung, Außentemperatur, Rücklauftemperatur): ob das MQTT-Gateway sie dem Titel zuordnet, ist an keiner Anlage geprüft. Kommt an einem Eingang nie ein Wert, im Protokoll des Gateways die Zeile „Preparing input …“ mit dem Titel des Eingangs vergleichen."
SEITE1_H7 = "Alter Weg UDP/TCP statt MQTT: Vorlagen „UDP-Eingänge“ und „TCP-Ausgänge“ (oben unter „Bestehende Anlagen“), Titel „&lt;Gerät&gt; &lt;Name&gt;“, Lebenszeichen „Zähler (Lebenszeichen)“, Verbindung „Online“ – dieselben Bausteine, nur andere Eingänge. Für dieselben Bausteine nur einen der beiden Wege nehmen."
SEITE2_SCHRITT1 = "Die Eingänge dieser Seite wie auf der Seite „WOLF ISM NG“ als einfache Virtuelle Eingänge anlegen, Titel aus der Spalte Name (Nr. 1–3, 5–9, 11, 13–16, 18)."
SEITE2_SCHRITT2 = "Seite „WOLF ISM NG Werte“ anlegen und die 14 Eingänge darauf ziehen. An Kesseltemperatur, Außentemperatur, Modulationsgrad und Warmwassertemperatur im Eigenschaftsfenster „Statistik“ einschalten."
SEITE2_SCHRITT3 = "Benachrichtigung „Meldung Anlagendruck niedrig (WOLF)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste."
SEITE2_SCHRITT4 = "Übrige Bausteine über F5; die Formeln und die Ein-/Aus-Werte der Schwellwertschalter wie in der Liste eintragen. Am Status „Heizkreis jetzt (WOLF)“ vorher dreimal auf das „+“ klicken (V5 bis V7)."
SEITE2_SCHRITT5 = "Speichern und übertragen. Probe: Kessel- und Warmwassertemperatur mit der Anzeige am Bedienmodul vergleichen, „Anlagendruck (WOLF)“ mit dem Manometer."
SEITE2_H1 = "Messwerte (Temperaturen, Druck, Leistung) kommen nur bei Änderung und spätestens alle 30 Minuten neu; nach einem Neustart des Miniservers kann ein Wert bis dahin 0 zeigen. Zustände (Brenner, Pumpen, Programme) sind sofort da."
SEITE2_H2 = "<b>Zu Nr. 18 bis 25:</b> der Anlagendruck kommt in Pa (100 000 Pa = 1 bar), Nr. 19 rechnet ihn in bar. Am Eingang Nr. 18 im Eigenschaftsfenster unter Validierung „Min“ −670000 und „Max“ 670000 setzen (die Namenstabelle nennt den Bereich) – Loxone macht aus jedem Wert außerhalb der Grenzen 0, und „Anlagendruck (WOLF)“ zeigt dann dauernd „kein Druckwert“."
SEITE2_H3 = "„Druck niedrig“ (Nr. 21) ist ein Beispiel – den Mindestdruck der eigenen Anlage nennt der Fachbetrieb. „Druck gemeldet“ (Nr. 20) hält die Meldung still, solange kein Druckwert da ist."
SEITE2_H4 = "Die Raumtemperatur (Nr. 6) kommt nur mit Raumfühler im Bedienmodul; sonst steht dort 0."
SEITE2_H5 = "Mehrere Heizkreise: die Bausteine des Mischerkreises nach demselben Muster anlegen (oben das Gerät „Mischerkreis 1 + Warmwasser 1“ anhaken)."
SEITE3_SCHRITT1 = "Im Reiter MQTT „Befehle über MQTT annehmen“ und „Heizung über MQTT stellen“ anhaken und speichern (beide ab Werk aus). Die vier Befehle (Nr. 3, 6, 8, 10) kommen an den gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Adresse /dev/udp/&lt;LoxBerry&gt;/11884) – ohne ihn oben die „Vorlage MQTT-Befehle“ herunterladen und einmal importieren (Peripherie → Virtuelle Ausgänge → Vorlage importieren)."
SEITE3_SCHRITT2 = "Seite „WOLF ISM NG Bedienung“ anlegen. Die 4 Befehle mit genau dem Befehl der Liste anlegen (Befehl bei Analogwert, nie retain) und die 2 Rückmeldungen (Nr. 11, 12) als Virtuelle Eingänge nach der Namenstabelle."
SEITE3_SCHRITT3 = "Zwei Radiotasten anlegen: Tastenzahl und Tastentexte wie in der Liste, Text für „keine Taste gewählt“ „wie an der Heizung“, Remanenz aus. Der Ausgang mit der Nummer der gewählten Taste heißt in Config „N“: Ausgang N an den Eingang I1 der Formel (Nr. 2 bzw. Nr. 5). Zwei Schieberegler anlegen (Peripherie → Virtuelle Eingänge) mit Min, Max, Schritt und Startwert wie in der Liste, dazu die zwei Formeln."
SEITE3_SCHRITT4 = "Nur wenn das SG-Modul des Plugins genutzt wird (Reiter SG-Ready): vier Virtuelle Eingänge und einen Virtuellen Texteingang mit genau den Namen der Liste anlegen (Nr. 14–18; am Texteingang „In Visualisierung verwenden“ an) und am Status „SG-Ready (WOLF)“ einmal auf das „+“ klicken (V5). Ohne SG-Modul Nr. 14–19 weglassen."
SEITE3_SCHRITT5 = "Speichern und übertragen. Probe: in der App „Warmwasser-Programm (WOLF)“ auf „Dauerbetrieb“ stellen – nach kurzer Zeit zeigt „Warmwasser (WOLF)“ auf der Seite „WOLF ISM NG Werte“ „Dauerbetrieb“. Im Plugin Reiter „Test“ → „Zuletzt empfangene Werte“ steht der Befehl."
SEITE3_H1 = "<b>Diese Befehle schreiben an die Heizung.</b> Das Plugin wurde ohne WOLF-Heizung gebaut; was die Heizung auf einen Befehl tut, ist nicht erprobt. Nach jedem ersten Befehl am Bedienmodul der Heizung nachsehen."
SEITE3_H2 = "Plugin und Dienst sichern ab: die Befehlsbrücke nimmt nur mit beiden Haken an und nur die erlaubten Werte (Heizkreis 0–3, Warmwasser 0–4, Warmwasser 20–80 °C, Korrektur −4 bis +4 K); der Dienst nimmt beim Warmwasser-Programm nur 0, 2 oder 4, schickt ohne Verbindung zum ISM8 nichts hinaus und sendet denselben Wert binnen 60 s nicht noch einmal. Die Quittung steht unter &lt;Präfix&gt;/befehl/&lt;Name&gt;/quittung (Reiter Test)."
SEITE3_H3 = "<b>Zu den Radiotasten:</b> die Formel macht aus Ausgang N (Nummer der gewählten Taste) den Wert der Heizung. Ohne gewählte Taste entsteht ein negativer Wert, den das Plugin abweist – nach einem Neustart des Miniservers wird so nichts gestellt (Remanenz aus)."
SEITE3_H4 = "Das SG-Modul des Plugins stellt beim Wechsel seiner Lage dieselben vier Werte. Wer es mit „An die Heizung schreiben“ betreibt, stellt hier nur von Hand nach – der nächste Lagewechsel überschreibt es. Ein § 14a-Signal aus Loxone an das Plugin gibt es nicht."
SEITE3_H5 = "„Standby“ heißt beim Heizkreis: nur Frostschutz; beim Warmwasser: kein warmes Wasser. Die Zeitprogramme stellt man an der Heizung."
SEITE3_H6 = "Ein Schreibbefehl braucht einen virtuellen Ausgang, keinen Eingang, und nie den Namen eines Gateway-Eingangs (die Befehle heißen „WOLF ISM NG: …“). Mit der Schreibprobe im Reiter „Test“ lässt sich ein Befehl vorher trocken durchspielen."
SEITE3_H7 = "Bis 3.1.11 schrieben die Befehle mit der Ausgangsvorlage „Wolf ISM8 MQTT Befehle“ auf die Zustandsthemen. Das wirkt seit 3.1.12 nur noch mit dem Haken „Befehle über die Zustandsthemen annehmen (alter Weg)“; ein Update setzt ihn, eine Neuinstallation nicht. Neu: die Befehle der Liste über die Befehlsbrücke."
