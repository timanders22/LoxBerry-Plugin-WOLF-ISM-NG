Z2_16 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Direkter_Heizkreis_Programmwahl_Warmwasser | Hot water programme of the heating: 0 automatic, 2 continuous operation, 4 standby | —"
