Z2_11 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Heizgerät_1_Abgastemperatur | Flue gas temperature in °C | —"
Z2_12 = "Status | Brenner (WOLF) | Rows: V1 = 1 “burner on – output <v2> %%, flue gas <v3.0> °C”; without condition “burner off – flue gas <v3.0> °C”; Visualisation ON | V1 = #8, V2 = #7, V3 = #11"
