[BAUSTEIN]
H = "Three ready-made pages from the sample project"
EINLEITUNG = "The three pages of the LoxBerry plugins sample project for a gas condensing heating with a direct heating circuit and hot water (firmware 1.8; devices Heizgerät 1, Systembedienmodul, Direkter Heizkreis + direktes Warmwasser, Allgemein): “WOLF ISM NG” (is it running, does the heating report a fault, operating mode), “WOLF ISM NG Werte” (temperatures, burner, hot water, system pressure) and “WOLF ISM NG Bedienung” (programmes and set values from the app, display of the SG-Ready module). For each page instructions for taking it over, the table, notes and a picture. Whoever works through the table from top to bottom has rebuilt the page; the blocks are found in Loxone Config via the block search (F5). The names of the inputs and the topics of the commands are shown with the configured prefix and firmware, the heating circuit data points for the circuit from the tab SG-Ready. The MQTT path with Virtual Inputs and the command bridge is built; a note on the first page describes the old path UDP/TCP."
TH_TYP = "Block (type)"
TH_NAME = "Name"
TH_PARAM = "Parameters"
TH_EINGANG = "Connect inputs to"
ANSAGE = "On the speech output (Settings tab): the announcements on fault and outage are triggered by the plugin's own timer - no new block needed."
Z1_01 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_status_zaehler | Sign of life 0 to 999: the service counts up by one with every heartbeat (every 60 s) and sends the count (never retained) – also while the ISM8 is disconnected | —"
Z1_02 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_status_ok | 1 = the ISM8 of the heating is connected and has delivered valid data, 0 = not; arrives with every heartbeat (never retained) | —"
Z1_03 = "Constant | Konstante 1 | Value 1 | —"
Z1_04 = "Value Validator | Lebenszeichen fehlt (WOLF) | Tmc 300 s (five signs of life of 60 s each without a new value), Min 0, Max 999 – if the LoxBerry, the MQTT gateway or the service stops, the counter stops; remove the tick at ‘En’ in the properties window | V = #1, En = #3"
Z1_05 = "NOT | Keine frischen Daten (WOLF) | — (the ISM8 is not connected; a stopped service is reported by no. 4) | I = #2"
Z1_06 = "OR | Störung (WOLF) | — (no fresh data or sign of life missing) | I1 = #5, I2 = output E of #4"
Z1_07 = "Switch-On Delay | Störung bestätigt (WOLF) | 600 s (ten signs of life of 60 s each; the ISM8 only sends values on change, that is why the heartbeat counts; a restart of the ISM8, the service or the LoxBerry reports nothing) | Input = #6"
Z1_08 = "Notification | Meldung Plugin gestört (WOLF) | Text: WOLF ISM NG – no connection to the heating for 10 minutes: the ISM8 is not connected (power, network, target IP in the ISM8) or the LoxBerry, the MQTT gateway or the service has stopped. Values in the app are then old, commands have no effect. Read the status “Zustand (WOLF)” in the app | Input = #7"
Z1_09 = "Status | Zustand (WOLF) | Rows: V1 = 1 “sign of life missing for at least 5 minutes – LoxBerry, MQTT gateway (subscription or tick wolf_ng) or service has stopped; open the LoxBerry in the browser, in the plugin tab Test ‘Server state’, otherwise ‘Restart server’”; V2 = 0 “ISM8 not connected – check power and network of the ISM8, in its web interface target IP and port as in the plugin tab ‘Loxone integration’, step 1; in the plugin tab Test ‘Check network ports’”; without condition “running – ISM8 connected, sign of life <v3>”; Visualisation ON | V1 = output E of #4, V2 = #2, V3 = #1"
Z1_10 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Heizgerät_1_Störung | 1 = the heating appliance reports a fault (state, stays until it is cleared) | —"
Z1_11 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Systembedienmodul_Störung | 1 = the system operating module reports a fault | —"
Z1_12 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Allgemein_Zuletzt_aktiver_Störcode | Number of the last active fault code; stays after the fault has been cleared; the plugin shows the plain text in the tab “Loxone integration” (choose the fault code table of your own heat generator in the tab Settings) | —"
Z1_13 = "OR | Heizung meldet Störung (WOLF) | — (heating appliance or system operating module; for each further device with a fault message one more OR behind it: I1 = the previous OR, I2 = the next fault) | I1 = #10, I2 = #11"
Z1_14 = "Switch-On Delay | Heizungsstörung bestätigt (WOLF) | 60 s (a fault message that only flashes up briefly, for example when the heating appliance starts, reports nothing) | Input = #13"
Z1_15 = "Notification | Meldung Heizung gestört (WOLF) | Text: WOLF ISM NG – the heating reports a fault. Fault code in the status “Heizungsstörung (WOLF)”; read it on the operating module of the heating, plain text in the plugin tab “Loxone integration” (fault codes in plain text). If it cannot be acknowledged on the appliance, call the heating engineer | Input = #14"
Z1_16 = "Status | Heizungsstörung (WOLF) | Rows: V4 = 0 “unknown – no connection to the ISM8 (status ‘Zustand (WOLF)’); last active fault code <v3>”; V1 = 1 “the heating appliance reports a fault – fault code <v3>; read it on the operating module, plain text in the plugin tab ‘Loxone integration’”; V2 = 1 “the system operating module reports a fault – fault code <v3>”; without condition “no fault – last active fault code <v3>”; Visualisation ON | V1 = #10, V2 = #11, V3 = #12, V4 = #2"
Z1_17 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Heizgerät_1_Betriebsart | Operating mode of the heating appliance as a number (plain text in status no. 18) | —"
Z1_18 = "Status | Betriebsart Heizgerät (WOLF) | Rows: V2 = 0 “unknown – no connection to the ISM8”; V1 = 1 “heating and hot water mode”; V1 = 6 “standby”; V1 = 11 “frost protection”; V1 = 7 “GLT – external specification (output or boiler set temperature)”; V1 = 0 “chimney sweep”; V1 = 15 “calibration”; without condition “operating mode <v1> – not in the table of the plugin”; Visualisation ON | V1 = #17, V2 = #2"
