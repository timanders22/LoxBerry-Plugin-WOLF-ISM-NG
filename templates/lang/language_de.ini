ERLAEUTERUNG = "Zu {B6}: Das ISM8 sendet nur bei Wertänderung. Eine Überwachung auf einen Messwert schlägt deshalb Fehlalarm, sobald die Heizung ruhig ist — der umlaufende Zähler ändert sich dagegen unabhängig davon. Ins ODER gehört die Umkehrung {B7}: der Ausgang von {B6} ist EIN, solange Lebenszeichen kommen.<br>Zu {B9} bis {B11}: Der Benachrichtigungsbaustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang — sonst verschluckt eine dauerhaft aktive Quelle alle übrigen. Erst über ODER zusammenführen, je ODER höchstens zwei Eingänge.<br>Zu {B13} und {B14}: Ein Schreibbefehl braucht einen virtuellen Ausgang, keinen Eingang. Ob er angekommen ist, sagt die Antwort des Servers — im Reiter Test lässt sich das mit der Schreibprobe trocken durchspielen.<br>Zum Zeitstempel: Loxone rechnet Zeiten in Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,7 Milliarden), müssen 1230768000 abgezogen werden."

