[SPRACHAUSGABE]
H = "Speech output: announcement on fault and outage (off by default)"
EINLEITUNG = "The plugin announces two events through the shared speech output of the plugins of this house: Loxone Music Server, MusicServer4Home, an own address template, Alexa-NG or Google speakers (Chromecast 4 Lox NG). A timer checks the state snapshot of the service every five minutes. Each event is announced once when it occurs - not on every run. Address and template must be in the home network. MQTT, UDP and the values in Loxone stay unchanged."
