SONOX_HINWEIS="Die Ansage geht an den Dienst des Plugins SonoX auf diesem LoxBerry (Port aus dessen Einstellungen, ab Werk 5005). Datenschutz: SonoX erzeugt die Sprache ab Werk über Google (translate.google.com, unverschlüsselt) – jeder Ansagetext geht damit ins Internet; auch die anderen Sprachanbieter in SonoX sind Internetdienste. Der Reiter Test fragt nur die Raumliste ab und spricht nicht. Eine zweite Ansage an denselben Raum schneidet die erste ab. Fällt SonoX aus, entfällt die Ansage."
