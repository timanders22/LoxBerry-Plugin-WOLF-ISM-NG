<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wolf ISM8 - Plugin-Symbol nach Hausstandard.
  Runde Scheibe in LoxBerry-Gruen #6dac20, Motiv weiss:
  Flamme (Waermeerzeuger) mit aufsteigenden Funkwellen (Datenuebertragung).
  Keine fremde Wortmarke, kein Herstellerlogo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <circle cx="256" cy="256" r="256" fill="#6dac20"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>

  <!-- Flamme: aeussere Kontur -->
  <path fill="#ffffff" d="
    M 214 96
    c 8 44 -14 66 -38 92
    c -26 28 -42 58 -42 96
    c 0 62 51 108 122 108
    c 71 0 122 -46 122 -108
    c 0 -44 -20 -74 -52 -104
    c -8 34 -24 48 -38 52
    c 10 -50 -12 -104 -74 -136
    z"/>

  <!-- Flammenkern -->
  <path fill="#6dac20" d="
    M 244 226
    c 6 30 -8 44 -22 60
    c -14 16 -22 32 -22 52
    c 0 32 24 54 56 54
    c 32 0 56 -22 56 -54
    c 0 -26 -14 -42 -34 -60
    c -2 20 -12 28 -22 30
    c 8 -30 -4 -60 -12 -82
    z"/>

  <!-- Funkwellen: Daten verlassen das Geraet -->
  <g fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round">
    <path d="M 350 168 a 54 54 0 0 1 0 76"/>
    <path d="M 386 132 a 105 105 0 0 1 0 148"/>
    <path d="M 422  96 a 156 156 0 0 1 0 220"/>
  </g>
</svg>
