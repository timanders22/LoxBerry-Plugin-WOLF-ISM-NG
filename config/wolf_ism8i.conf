######################################################################
# Konfiguration des Wolf-ISM8-Servers.
# Je Zeile ein Eintrag, Schluessel und Wert durch ein Leerzeichen getrennt.
# Zeilen mit einem Doppelkreuz werden vom Server uebersprungen -
# deshalb keine Kommentare hinter einem Wert.
######################################################################

enable 0
ism8i_port 12004
input_port 12005
fw_version 1.8
multicast_ip 239.7.7.77
multicast_port 35353
dp_log 0
output none
mqtt 1
pull_on_write 0
online_timeout -1
# Diese vier fehlten bis 3.0.10. Die Oberflaeche bot sie an, die
# mitgelieferte Datei kannte sie nicht - der Reiter Test meldete auf
# jeder frischen Anlage "Konfiguration vollstaendig? Nein", bis der
# Anwender einmal gespeichert hatte.
praefix wolf_ng
herzschlag 60
abgleich_takt 0
# Leer heisst: KEINE Stoercodetabelle gewaehlt. Datenpunkt 372 bedeutet
# je nach Waermeerzeuger Verschiedenes, und eine falsche Tabelle waere
# schlimmer als gar keine - deshalb wird hier nichts vorbelegt.
stoercodes
# SG-Ready und Paragraph 14a, alles ab Werk aus. Diese Zeilen fehlten seit
# 3.1.0 - der Reiter Test meldete auf jeder frischen Anlage "Konfiguration
# vollstaendig? Nein", bis einmal gespeichert war (Durchgang 02.10.2026, O9).
# Die Werte sind die aus wi_defaults() in wi_lib.php.
sg_ein 0
sg_senden 0
sg_quelle aus
sg_awattar_ordner spotpreis
sg_stunden 4
sg_block 2
sg_horizont 24
sg_kreis direkt
sg_ww_normal 48
sg_ww_laden 55
sg_korrektur 2
sg_laden_max 6
sg_14a 0
sg_14a_modus spar
sg_14a_alter 900
