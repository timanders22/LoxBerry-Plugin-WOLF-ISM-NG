[BAUSTEIN]
H = "Drei fertige Seiten aus dem Musterprojekt"
EINLEITUNG = "Die drei Seiten des LoxBerry-Plugins Musterprojekts für eine Gas-Brennwertheizung mit direktem Heizkreis und Warmwasser (Firmware 1.8; Geräte Heizgerät 1, Systembedienmodul, Direkter Heizkreis + direktes Warmwasser, Allgemein): „WOLF ISM NG“ (läuft es, meldet die Heizung eine Störung, Betriebsart), „WOLF ISM NG Werte“ (Temperaturen, Brenner, Warmwasser, Anlagendruck) und „WOLF ISM NG Bedienung“ (Programme und Sollwerte aus der App, Anzeige des SG-Ready-Moduls). Je Seite eine Anleitung zum Übernehmen, die Tabelle, Hinweise und ein Bild. Wer die Tabelle von oben nach unten abarbeitet, hat die Seite nachgebaut; die Bausteine findet man in Loxone Config über die Baustein-Suche (F5). Die Namen der Eingänge und die Themen der Befehle stehen hier mit dem eingestellten Präfix und der Firmware, die Heizkreis-Datenpunkte für den Kreis aus dem Reiter SG-Ready. Gebaut ist der MQTT-Weg mit Virtuellen Eingängen und der Befehlsbrücke; den alten Weg UDP/TCP beschreibt ein Hinweis der ersten Seite."
