ERLAEUTERUNG = "On {B6}: The ISM8 only sends on value changes. A monitor on a measured value therefore raises false alarms as soon as the heating is quiet — the wrapping counter changes regardless. The analog value validation switches its output error (E in Loxone Config) ON as soon as no new value arrives within Tmc; this output goes straight into the OR {B9}. Connect the counter to V, not to En; connect a constant 1 to En – unconnected, the block does not validate.<br>On {B9} to {B11}: The notification block only sends on a change from off to on. Never connect several sources directly to its input — a permanently active source would swallow all the others. Combine them with OR first, at most two inputs per OR.<br>On {B13} and {B14}: A write command needs a virtual output, not an input. The server’s reply says whether it arrived — the Test tab lets you rehearse this as a dry run.<br>On the time stamp: Loxone counts time in seconds since 2009-01-01. If a time block delivers Unix time (values around 1.7 billion), subtract 1230768000."
ANSAGE = "On the speech output (Settings tab): the announcements on fault and outage are triggered by the plugin's own timer - no new block needed."

