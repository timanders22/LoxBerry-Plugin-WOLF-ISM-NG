Z2_02 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Heizgerät_1_Kesselsolltemperatur | Boiler set temperature the heating appliance is currently aiming for, in °C | —"
Z2_03 = "Virtual input (name as the MQTT gateway assigns it, plugin WOLF ISM NG) | wolf_ng_Heizgerät_1_Rücklauftemperatur | Return temperature in °C | —"
Z2_04 = "Formula | Spreizung (WOLF) | I1-I2 (boiler minus return in K) | I1 = #1, I2 = #3"
