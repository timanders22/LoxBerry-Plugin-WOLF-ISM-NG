; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Wolf ISM8 server"
K02 = "The plugin receives the data of the Wolf ISM8 interface module, translates the KNX telegrams into readable values and passes them on to the Miniserver — via MQTT or, the old way, via UDP. In the other direction it accepts write commands from the Miniserver."
K03 = "Set up in four steps"
K04 = "In the ISM8, enter the address of the LoxBerry and the ISM8 TCP port (default 12004). Both are shown on the <i>Loxone integration</i> tab."
K05 = "On the <i>Settings</i> tab, switch the server on and save."
K06 = "The tab <i>Loxone integration</i> shows the name table (titles of the Virtual Inputs as the MQTT gateway assigns them), the tick list for gateway V2 and the commands. Below it three ready-made pages from the LoxBerry plugins sample project – for each page instructions for taking it over, the block table, notes and a picture."
K07 = "In Loxone Config: Periphery → <i>Virtual Inputs</i> → one Virtual Input per value with the title from the name table. Commands via the command bridge: on the <i>MQTT</i> tab tick “Accept commands via MQTT” and “Set the heating via MQTT” (off by default)."
K08 = "MQTT or TCP/UDP?"
K09 = "<b>MQTT is the recommended way.</b> The topics are named (<tt>wolf_ng/&lt;device&gt;/&lt;data point&gt;</tt>), states (switches, operating modes, set values and targets) arrive retained — after a restart of the Miniserver they are there again immediately; measured values and the sign of life do not — and the gateway's MQTT Finder shows what actually arrives."
K10 = "<b>Direct TCP/UDP output</b> is the old way and is switched off by default. It is only needed if an existing Loxone configuration depends on it. Both ways can run side by side during the changeover."
K11 = "If no values arrive"
K12 = "<i>Test</i> tab → <i>Server state</i>: are the watchdog and the decoding module running?"
K13 = "<i>Test</i> tab → <i>Check network ports</i>: is the ISM8 port listening?"
K14 = "The ISM8 only sends <b>when a value changes</b>. After a restart it can take a while for the first telegram to arrive. Changing a target temperature on the appliance forces one."
K15 = "<i>Log files</i> tab: the server log usually names the reason in plain words."
K16 = "Firmware"
K17 = "The data point table depends on the firmware of the ISM8 (1.4, 1.5, 1.7, 1.8 or 1.9). The version set here must match the one shown in the ISM8 web interface — otherwise the data point numbers do not line up. After changing it, the Loxone templates have to be generated again."
K18 = "Announcements and gateway V2"
K19 = "Announcements can also run via <b>Sonos4Lox</b> and <b>SonoX</b> (since 3.1.13, not selected by default, unmeasured – no Sonos in the house); the Test tab checks that the plugin is installed and knows the zone or room. <b>SonoX sends the announcement text to Google</b> (speech synthesis there) and only answers after playback (up to 30 s). Under MQTT gateway V2 the Test tab checks that all data points of the tick list are ticked and “Noncached” is right."
K20 = "<b>Several speakers at once</b> (since 3.1.13, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 3.1.13 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output."
