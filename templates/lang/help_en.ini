; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Wolf ISM8 server"
K02 = "The plugin receives the data of the Wolf ISM8 interface module, translates the KNX telegrams into readable values and passes them on to the Miniserver — via MQTT or, the old way, via UDP. In the other direction it accepts write commands from the Miniserver."
K03 = "Set up in four steps"
K04 = "In the ISM8, enter the address of the LoxBerry and the ISM8 TCP port (default 12004). Both are shown on the <i>Loxone integration</i> tab."
K05 = "On the <i>Settings</i> tab, switch the server on and save."
K06 = "On the <i>Loxone integration</i> tab, tick the devices you need and download the MQTT templates."
K07 = "In Loxone Config: right-click the Miniserver → <i>Paste template</i>."
K08 = "MQTT or TCP/UDP?"
K09 = "<b>MQTT is the recommended way.</b> The topics are named (<tt>wolf_ng/&lt;device&gt;/&lt;data point&gt;</tt>), the values arrive retained — after a restart of the Miniserver the last state is there again immediately — and the gateway's MQTT Finder shows what actually arrives."
K10 = "<b>Direct TCP/UDP output</b> is the old way and is switched off by default. It is only needed if an existing Loxone configuration depends on it. Both ways can run side by side during the changeover."
K11 = "If no values arrive"
K12 = "<i>Test</i> tab → <i>Server state</i>: are the watchdog and the decoding module running?"
K13 = "<i>Test</i> tab → <i>Check network ports</i>: is the ISM8 port listening?"
K14 = "The ISM8 only sends <b>when a value changes</b>. After a restart it can take a while for the first telegram to arrive. Changing a target temperature on the appliance forces one."
K15 = "<i>Log files</i> tab: the server log usually names the reason in plain words."
K16 = "Firmware"
K17 = "The data point table depends on the firmware of the ISM8 (1.4, 1.5, 1.7, 1.8 or 1.9). The version set here must match the one shown in the ISM8 web interface — otherwise the data point numbers do not line up. After changing it, the Loxone templates have to be generated again."
