Z2_24 = "Notification | Meldung Anlagendruck niedrig (WOLF) | Text: WOLF ISM NG – the system pressure of the heating has been below 1.0 bar for 10 minutes. Check the pressure gauge of the heating; top up heating water (or have it topped up). If the pressure keeps falling, the system is leaking or the expansion vessel is defective – heating engineer | Input = #23"
