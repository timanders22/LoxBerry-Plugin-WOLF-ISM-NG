; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Wolf ISM8 Server"
K02 = "Das Plugin nimmt die Daten des Wolf-Schnittstellenmoduls ISM8 entgegen, übersetzt die KNX-Telegramme in lesbare Werte und reicht sie an den Miniserver weiter — per MQTT oder, auf dem alten Weg, per UDP. In der Gegenrichtung nimmt es Schreibbefehle des Miniservers entgegen."
K03 = "In vier Schritten eingerichtet"
K04 = "Im ISM8 die Adresse des LoxBerry und den ISM8-TCP-Port eintragen (Vorgabe 12004). Beides steht im Reiter <i>Einbindung in Loxone</i>."
K05 = "Im Reiter <i>Einstellungen</i> den Server einschalten und speichern."
K06 = "Im Reiter <i>Einbindung in Loxone</i> stehen die Namenstabelle (Titel der Virtuellen Eingänge, so wie das MQTT-Gateway sie vergibt), die Hakenliste für Gateway V2 und die Befehle. Darunter drei fertige Seiten aus dem LoxBerry-Plugins Musterprojekt – je Seite eine Anleitung zum Übernehmen, die Baustein-Tabelle, Hinweise und ein Bild."
K07 = "In Loxone Config: Peripherie → <i>Virtuelle Eingänge</i> → je Wert ein Virtueller Eingang mit dem Titel aus der Namenstabelle. Befehle über die Befehlsbrücke: im Reiter <i>MQTT</i> „Befehle über MQTT annehmen“ und „Heizung über MQTT stellen“ anhaken (ab Werk aus)."
K08 = "MQTT oder TCP/UDP?"
K09 = "<b>MQTT ist der empfohlene Weg.</b> Die Themen sind benannt (<tt>wolf_ng/&lt;Gerät&gt;/&lt;Datenpunkt&gt;</tt>), Zustände (Schalter, Betriebsarten, Sollwerte und Vorgaben) kommen retained an — nach einem Neustart des Miniservers stehen sie sofort wieder da; Messwerte und das Lebenszeichen nicht — und im MQTT Finder des Gateways ist sichtbar, was tatsächlich ankommt."
K10 = "Die <b>TCP/UDP-Direktausgabe</b> ist der alte Weg und ab Werk ausgeschaltet. Sie wird nur gebraucht, wenn eine bestehende Loxone-Konfiguration daran hängt. Beide Wege lassen sich während der Umstellung gleichzeitig betreiben."
K11 = "Wenn keine Werte ankommen"
K12 = "Reiter <i>Test</i> → <i>Serverzustand</i>: laufen Watchdog und Auswertungsmodul?"
K13 = "Reiter <i>Test</i> → <i>Netzwerkports prüfen</i>: horcht der ISM8-Port?"
K14 = "Das ISM8 sendet <b>nur bei Wertänderungen</b>. Nach einem Neustart kann es dauern, bis das erste Telegramm kommt. Eine Solltemperatur am Gerät zu verstellen erzwingt eines."
K15 = "Reiter <i>Logdateien</i>: das Protokoll des Servers nennt den Grund meistens im Klartext."
K16 = "Firmware"
K17 = "Die Datenpunkttabelle hängt an der Firmware des ISM8 (1.4, 1.5, 1.7, 1.8 oder 1.9). Die eingestellte Version muss zu der passen, die in der Weboberfläche des ISM8 steht — sonst stimmen die Datenpunktnummern nicht. Nach einer Umstellung müssen die Loxone-Vorlagen neu erzeugt werden."
K18 = "Sprachausgabe und Gateway V2"
K19 = "Die Ansage kann auch über <b>Sonos4Lox</b> und <b>SonoX</b> laufen (seit 3.1.13, ab Werk nicht gewählt, ungemessen – kein Sonos im Haus); der Reiter Test prüft, ob das Plugin installiert ist und Zone bzw. Raum kennt. <b>SonoX schickt den Ansagetext an Google</b> (Sprachausgabe dort) und antwortet erst nach der Wiedergabe (bis 30 s). Unter MQTT-Gateway V2 zählt der Reiter Test nach, ob alle Datenpunkte der Hakenliste angehakt sind und „Noncached“ stimmt."
K20 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 3.1.13, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 3.1.13 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück."
